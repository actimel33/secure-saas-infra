# Осознанно принятые срабатывания сканера.
#
# Правило здесь появляется только вместе с обоснованием и сроком. Разбор
# каждого — в docs/challenges.md, раздел «Сканер безопасности ругается на
# требования задания».
#
# Срок истекает в конце года: исключение не должно пережить причину,
# по которой оно появилось. После этой даты сканер снова начнёт падать,
# и решение придётся принять заново.

misconfigurations:
  - id: AWS-0053
    paths:
      - "alb.tf"
    statement: >-
      Балансировщик доступен из интернета. Это условие задачи: SaaS
      обслуживает клиентов из интернета, и балансировщик — единственная
      публичная точка входа. За ним подсети без публичных адресов.
    expiration_date: 2026-12-31

  - id: AWS-0054
    paths:
      - "alb.tf"
    statement: >-
      Слушатель HTTP. У учебного проекта нет домена, а без домена не выдать
      сертификат ACM. Переменная certificate_arn готова: при её заполнении
      создаётся слушатель HTTPS с TLS 1.2+, а порт 80 переходит в редирект.
      Участок от балансировщика до инстансов зашифрован уже сейчас.
    expiration_date: 2026-12-31

  - id: AWS-0104
    paths:
      - "security-groups.tf"
    statement: >-
      Исходящие соединения по 443 в любой адрес. Приложению нужны обновления
      пакетов и вызовы API AWS, диапазон адресов у них не фиксирован. Порт 80
      закрыт, выход только через NAT.
      Сужается интерфейсными VPC-эндпоинтами по переключателю.
    expiration_date: 2026-12-31

  - id: AWS-0177
    paths:
      - "data.tf"
    statement: >-
      Защита базы от удаления выключена. Учебный стенд многократно поднимается
      и сносится.
      Управляется переменной db_deletion_protection, для production true.
    expiration_date: 2026-12-31
